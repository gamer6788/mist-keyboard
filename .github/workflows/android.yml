
name: MIST Keyboard Build Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm GitHub Actions works
        run: echo "MIST KEYBOARD WORKFLOW STARTED"

      - name: Check repository
        uses: actions/checkout@v4

      - name: Check Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Confirm build environment
        run: |
          java -version
          echo "GitHub Actions is working!"
