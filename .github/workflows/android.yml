
      - name: Diagnose XML files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib

          files = [
              pathlib.Path("app/src/main/AndroidManifest.xml"),
              pathlib.Path("app/src/main/res/xml/method.xml")
          ]

          for path in files:
              print("\n" + "=" * 60)
              print("FILE:", path)
              print("=" * 60)

              raw = path.read_bytes()
              print("FIRST 100 BYTES:", repr(raw[:100]))

              content = raw.decode("utf-8-sig")

              for number, line in enumerate(content.splitlines(), 1):
                  print(f"LINE {number}: {line!r}")

              print("XML DECLARATIONS:", content.count("<?xml"))
          PY
