
      - name: Check XML resource files
        run: |
          echo "Checking all XML files..."

          find app/src -type f -name "*.xml" -print

          echo "Searching for XML declarations..."
          grep -Rn -E '<\?xml' app/src --include="*.xml" || true

          echo "Checking XML files for duplicate declarations..."
          python3 - <<'PY'
          import pathlib
          import re

          for path in pathlib.Path("app/src").rglob("*.xml"):
              content = path.read_text(encoding="utf-8-sig")
              declarations = list(re.finditer(r'<\?xml\b', content, re.I))

              if len(declarations) > 1:
                  print("MULTIPLE DECLARATIONS:", path)

              if declarations and content[:declarations[0].start()].strip():
                  print("TEXT BEFORE XML DECLARATION:", path)

              if not declarations and not content.lstrip().startswith("<"):
                  print("CHECK FILE:", path)
          PY
