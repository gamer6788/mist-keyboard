
name: MIST Keyboard Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Inspect repository structure
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== SETTINGS FILE ====="
          cat settings.gradle.kts

          echo "===== APP DIRECTORY ====="
          ls -la app

          echo "===== APP BUILD FILE ====="
          cat app/build.gradle.kts

      - name: Check Gradle projects
        run: gradle projects --info

      - name: Build MIST Keyboard APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIST-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
