

      - name: Diagnose XML files
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          for path in pathlib.Path("app/src").rglob("*.xml"):
              raw = path.read_bytes()
              content = raw.decode("utf-8-sig")

              print("\nFILE:", path)
              print("RAW START:", repr(raw[:80]))
              print("DECLARATIONS:", content.count("<?xml"))

              for i, line in enumerate(content.splitlines(), 1):
                  print(f"LINE {i}: {line!r}")

              try:
                  ET.fromstring(content)
                  print("RESULT: VALID")
              except ET.ParseError as e:
                  print("RESULT: INVALID:", e)
          PY
