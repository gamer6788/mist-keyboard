
name: MIST Keyboard Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Inspect project structure
        run: |
          echo "===== ROOT DIRECTORY ====="
          pwd
          ls -la

          echo "===== APP DIRECTORY ====="
          ls -la app

          echo "===== SETTINGS FILE ====="
          cat settings.gradle.kts

      - name: Validate all XML resources
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          import sys

          files = list(pathlib.Path("app/src").rglob("*.xml"))
          failed = False

          print(f"Found {len(files)} XML files")

          for path in files:
              try:
                  content = path.read_text(encoding="utf-8-sig")
                  ET.fromstring(content)
                  print(f"VALID: {path}")
              except Exception as error:
                  failed = True
                  print(f"INVALID: {path}")
                  print(f"ERROR: {error}")

          if failed:
              sys.exit(1)

          print("All XML files are valid.")
          PY

      - name: Check Gradle projects
        run: gradle projects

      - name: Build MIST Keyboard APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MIST-Keyboard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
